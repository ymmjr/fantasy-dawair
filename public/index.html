<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061b2d"><title>فانتسي دوائر</title>
<style>
:root{--bg:#03131f;--panel:#08283d;--panel2:#0c354f;--cyan:#16d8e8;--cyan2:#77f4ff;--text:#eefcff;--muted:#9fc4d4;--yellow:#ffd43b;--red:#ff6b78;--green:#6ce5a1}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#0c4763 0,#041927 34%,#020c14 100%);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}.wrap{width:min(1180px,94vw);margin:auto}.top{position:sticky;top:0;z-index:5;background:#031522ee;border-bottom:1px solid #17617e;backdrop-filter:blur(14px)}.top .wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}.mark{width:48px;height:48px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 24px #13d8e866}.mark:before{content:"◌";font-size:36px;color:var(--cyan)}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--cyan2),#18aee1);color:#002033;text-decoration:none;display:inline-block}.btn.sec{background:#0a2c43;color:#dffaff;border:1px solid #1d6d8d}.btn.yellow{background:linear-gradient(135deg,#ffe875,#ffbd2e);color:#2b1900}.btn:disabled{opacity:.45}.card{background:linear-gradient(180deg,#0b3049ee,#061d31ee);border:1px solid #1d6584;border-radius:22px;padding:18px;margin:16px 0;box-shadow:0 18px 50px #0005}.hero{padding:28px;border-color:#20dce8;background:linear-gradient(125deg,#0b3e59,#061c2d);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:300px;height:300px;border:40px solid #16d8e81b;border-radius:50%;left:-100px;top:-100px}.hero h1{font-size:clamp(34px,6vw,64px);margin:0 0 12px;text-shadow:0 4px #00314b}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 0}.nav a{background:#082a42;color:#cff7ff;border:1px solid #1c6887;border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:800;text-decoration:none;display:inline-flex;align-items:center}.nav a.on{background:var(--cyan);color:#00263a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#082a42;border:1px solid #1d6584;border-radius:17px;padding:15px}.stat b{display:block;font-size:28px;color:var(--cyan2)}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.rules{display:grid;gap:8px}.rule{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;background:#061b2d;border:1px solid #164e68;border-radius:12px}.pos strong{color:var(--green)}.neg strong{color:#ff9ba5}.tablebox{overflow:auto;border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #174c65;text-align:right}.table th{background:#0c3650;color:#bfefff}.input,select,textarea{width:100%;background:#031724;color:white;border:1px solid #246986;border-radius:11px;padding:10px;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--cyan)}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(840px,96vw);display:grid;grid-template-columns:1fr 1fr;background:#061d30;border:1px solid #23ddeb;border-radius:28px;overflow:hidden}.loginart{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:35px;background:linear-gradient(155deg,#0c526f,#062338);text-align:center}.ball{width:170px;height:170px;border:8px solid #16d8e8;border-radius:50%;display:grid;place-items:center;font-size:75px;box-shadow:0 0 45px #16d8e84d}.loginform{padding:34px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.hidden{display:none!important}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.group{background:#071f32;border:1px solid #17546f;border-radius:16px;padding:10px}.player{display:flex;align-items:center;gap:8px;padding:9px;margin:6px 0;border:1px solid #164b63;border-radius:11px;cursor:pointer;background:#061826}.player.sel{border-color:var(--cyan);background:#0c4057}.badge{margin-right:auto;border-radius:999px;padding:3px 7px;background:#10435c;color:#bcefff}.pitch{background:linear-gradient(#0f6848cc,#0c583dcc),repeating-linear-gradient(0deg,transparent 0 55px,#ffffff0c 56px 110px);border:2px solid #7af6d155;border-radius:20px;padding:18px;min-height:280px}.squad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{background:#05283bd9;border:1px solid #2fcddc;border-radius:14px;padding:10px;text-align:center;min-height:105px}.slot .shirt{font-size:30px}.tiny{padding:6px 8px;border-radius:9px;border:1px solid #27718c;background:#08283d;color:white;cursor:pointer;font-size:12px}.tiny.on{background:var(--yellow);color:#2b1900}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1px solid #26708e;border-radius:12px;background:#07283e;color:#defbff;cursor:pointer}.chip.on{background:#ffd43b;color:#261700}.toast{position:fixed;left:18px;bottom:18px;background:#071b29;border:1px solid #22d9e8;padding:12px 16px;border-radius:12px;z-index:50;display:none}.toast.bad{border-color:#ff6674}.savebar{position:sticky;bottom:10px;padding:10px;background:#041827dd;border:1px solid #1d6584;border-radius:16px;margin-top:12px;text-align:center}
@media(max-width:800px){.loginbox{grid-template-columns:1fr}.loginart{display:none}.grid,.groups{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.form{grid-template-columns:1fr}.squad{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div id="toast" class="toast"></div><div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const S={me:null,boot:null,page:null,draft:null,adminRound:null,pendingPath:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async(p,o={})=>{o.headers={'Content-Type':'application/json',...(o.headers||{})};let r=await fetch(p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'حدث خطأ');return j};
function toast(t,b=false){let x=$('#toast');x.textContent=t;x.className='toast'+(b?' bad':'');x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
const ROUTES={
participant:[
{key:'home',path:'/dashboard',label:'الرئيسية',view:home},
{key:'lineup',path:'/lineup',label:'تشكيلتي',view:lineupPage},
{key:'board',path:'/leaderboard',label:'الترتيب',view:board},
{key:'rules',path:'/rules',label:'القوانين',view:rules}
],
admin:[
{key:'home',path:'/admin/dashboard',label:'الرئيسية',view:adminHome},
{key:'players',path:'/admin/players',label:'اللاعبون',view:players},
{key:'participants',path:'/admin/participants',label:'المشتركون',view:participants},
{key:'rounds',path:'/admin/rounds',label:'الجولات',view:rounds},
{key:'scores',path:'/admin/scores',label:'رصد النقاط',view:scores},
{key:'settings',path:'/admin/settings',label:'الإعدادات',view:settingsAdmin}
]
};
const activeRoutes=()=>ROUTES[S.me?.role==='admin'?'admin':'participant'];
const defaultPath=()=>S.me?.role==='admin'?'/admin/dashboard':'/dashboard';
const routeForPath=path=>activeRoutes().find(x=>x.path===path);
const isAuthorizedPath=path=>!!routeForPath(path);
function navigate(path,replace=false){if(!S.me?.authenticated)return;history[replace?'replaceState':'pushState']({},'',path);renderRoute()}
function show(key){let r=activeRoutes().find(x=>x.key===key);navigate(r?r.path:defaultPath())}
async function renderRoute(){let r=routeForPath(location.pathname);if(!r){history.replaceState({},'',defaultPath());r=routeForPath(location.pathname)}S.page=r.key;[...document.querySelectorAll('#nav a')].forEach(x=>x.classList.toggle('on',x.getAttribute('href')===r.path));document.title=r.label+' — فانتسي دوائر';await r.view()}
document.addEventListener('click',e=>{let a=e.target.closest('a[data-route]');if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();navigate(a.getAttribute('href'))});
window.addEventListener('popstate',()=>{if(S.me?.authenticated)renderRoute();else{history.replaceState({},'','/login');login()}});
async function start(){S.me=await api('/api/me');if(S.me.authenticated){if(location.pathname==='/'||location.pathname==='/login'||!isAuthorizedPath(location.pathname))history.replaceState({},'',defaultPath());await shell()}else{if(location.pathname!=='/'&&location.pathname!=='/login')S.pendingPath=location.pathname;history.replaceState({},'','/login');login()}}
function login(){let admin=false;$('#app').innerHTML=`<div class="login"><div class="loginbox"><div class="loginart"><div class="ball">⚽</div><h1>فانتسي دوائر</h1><p class="muted">كوّن تشكيلتك ونافس على الصدارة</p></div><div class="loginform"><h1>تسجيل الدخول</h1><div class="tabs"><button id="p" class="btn">مشترك</button><button id="a" class="btn sec">مشرف</button></div><form id="lf"><div id="pf"><label>اسم المستخدم</label><input id="puser" class="input" autocomplete="username" placeholder="مثال: yousef"><br><br><label>رمز الدخول</label><input id="code" class="input" autocomplete="current-password"></div><div id="af" class="hidden"><label>اسم المستخدم</label><input id="user" class="input" value="admin"><br><br><label>كلمة المرور</label><input id="pass" type="password" class="input"></div><br><button class="btn" style="width:100%">دخول</button></form></div></div></div>`;
$('#p').onclick=()=>{admin=false;$('#pf').classList.remove('hidden');$('#af').classList.add('hidden');$('#p').className='btn';$('#a').className='btn sec'};
$('#a').onclick=()=>{admin=true;$('#af').classList.remove('hidden');$('#pf').classList.add('hidden');$('#a').className='btn';$('#p').className='btn sec'};
$('#lf').onsubmit=async e=>{e.preventDefault();try{await api(admin?'/api/login/admin':'/api/login/participant',{method:'POST',body:JSON.stringify(admin?{username:$('#user').value,password:$('#pass').value}:{username:$('#puser').value,code:$('#code').value})});S.me=await api('/api/me');let target=S.pendingPath&&isAuthorizedPath(S.pendingPath)?S.pendingPath:defaultPath();S.pendingPath=null;history.replaceState({},'',target);await shell()}catch(x){toast(x.message,true)}}}
async function shell(){S.boot=await api('/api/bootstrap');let admin=S.me.role==='admin';$('#app').innerHTML=`<div class="top"><div class="wrap"><div class="brand"><div class="mark"></div><div>فانتسي دوائر<div class="muted">${admin?'لوحة المشرف':esc(S.me.name)}</div></div></div><button id="logout" class="btn sec">خروج</button></div></div><main class="wrap"><nav id="nav" class="nav" aria-label="التنقل الرئيسي"></nav><div id="content"></div></main>`;
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});S.me={authenticated:false};S.boot=null;S.draft=null;history.replaceState({},'','/login');login()};
let nav=activeRoutes();$('#nav').innerHTML=nav.map(x=>`<a data-route href="${x.path}">${x.label}</a>`).join('');await renderRoute()}
function hero(title,sub){return `<section class="card hero"><h1>${title}</h1><p>${sub}</p></section>`}
function home(){let r=S.boot.current_round,lb=S.boot.leaderboard||[],me=lb.find(x=>x.id===S.me.id);$('#content').innerHTML=hero('فانتسي دوائر','اختر 8 لاعبين: اثنان من كل مجموعة، 6 أساسيين و2 احتياط، ثم اختر الكبتن ونائب الكبتن.')+`<div class="grid"><div class="stat"><b>${r?esc(r.name):'—'}</b><span>الجولة</span></div><div class="stat"><b>${me?.round_points||0}</b><span>نقاط الجولة</span></div><div class="stat"><b>${me?.total_points||0}</b><span>المجموع</span></div><div class="stat"><b>#${me?.rank||'—'}</b><span>ترتيبك</span></div></div><div class="card"><a class="btn yellow" data-route href="/lineup">اختيار التشكيلة</a></div>`}
function rules(){let s=S.boot.settings;let p=[['⚽','الهدف',s.points_goal],['🏆','الفوز',s.points_win],['🔥','هاتريك',s.points_hattrick],['⭐','الحضور',s.points_attendance],['👑','أفضل لاعب',s.points_best_player]],n=[['🟨','أصفر',s.points_yellow],['🟥','أحمر',s.points_red],['👟','بدون حذاء',s.points_no_shoes],['⚽','هدف عكسي',s.points_own_goal]];$('#content').innerHTML=hero('القوانين','لا أسعار، لا مراكز، ولا كلين شيت.')+`<div class="two"><div class="card"><h2>النقاط الإيجابية</h2><div class="rules">${p.map(x=>`<div class="rule pos"><span>${x[0]} ${x[1]}</span><strong>+${x[2]}</strong></div>`).join('')}</div></div><div class="card"><h2>الخصومات</h2><div class="rules">${n.map(x=>`<div class="rule neg"><span>${x[0]} ${x[1]}</span><strong>${x[2]}</strong></div>`).join('')}</div></div></div><div class="card"><h2>الطاقات</h2><div class="rules"><div class="rule"><span>👑 الكبتن ×3</span><strong>مرة واحدة</strong></div><div class="rule"><span>👥 تفعيل الدكة</span><strong>مرة واحدة</strong></div><div class="rule"><span>🔄 تغيير شامل</span><strong>مرة واحدة</strong></div></div></div>`}
function board(){let l=S.boot.leaderboard||[];$('#content').innerHTML=hero('الترتيب','الترتيب يتحدث حسب النقاط المرصودة.')+`<div class="card tablebox"><table class="table"><thead><tr><th>#</th><th>المشترك</th><th>الجولة</th><th>الإجمالي</th></tr></thead><tbody>${l.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.name)}</td><td>${x.round_points||0}</td><td><b>${x.total_points}</b></td></tr>`).join('')}</tbody></table></div>`}
function initDraft(){let l=S.boot.lineup;if(l)S.draft={players:l.players.map(x=>({player_id:x.player_id,role:x.role,bench_order:x.bench_order})),captain_player_id:l.captain_player_id,vice_player_id:l.vice_player_id,chip:l.chip};else S.draft={players:[],captain_player_id:0,vice_player_id:0,chip:null}}
function lineupPage(){if(!S.draft)initDraft();let D=S.draft,P=S.boot.players,r=S.boot.current_round;if(!r){$('#content').innerHTML='<div class="card">لا توجد جولة.</div>';return}let selected=new Set(D.players.map(x=>x.player_id)),counts={1:0,2:0,3:0,4:0};D.players.forEach(x=>{let p=P.find(y=>y.id===x.player_id);if(p)counts[p.group_no]++});let groups=[1,2,3,4].map(g=>`<div class="group"><h3>المجموعة ${g} <span class="badge">${counts[g]}/2</span></h3>${P.filter(x=>x.group_no===g).map(p=>`<div class="player ${selected.has(p.id)?'sel':''}" data-id="${p.id}">⚽ <span>${esc(p.name)}</span></div>`).join('')}</div>`).join('');
let starters=D.players.filter(x=>x.role==='starter'),bench=D.players.filter(x=>x.role==='bench');let slot=(x,b=false)=>{if(!x)return '<div class="slot muted">مكان فارغ</div>';let p=P.find(y=>y.id===x.player_id);return `<div class="slot"><div class="shirt">👕</div><b>${esc(p.name)}</b><div class="muted">المجموعة ${p.group_no}</div><div><button class="tiny ${D.captain_player_id===p.id?'on':''}" data-cap="${p.id}" ${b?'disabled':''}>كبتن</button> <button class="tiny ${D.vice_player_id===p.id?'on':''}" data-vice="${p.id}" ${b?'disabled':''}>نائب</button></div><button class="tiny" data-move="${p.id}">${b?'للأساسي':'للدكة'}</button> <button class="tiny" data-del="${p.id}">حذف</button></div>`};
let used=S.boot.used_chips||[];$('#content').innerHTML=hero('اختيار تشكيلتك',esc(r.name))+`<div class="card"><h2>اختر لاعبين من كل مجموعة</h2><div class="groups">${groups}</div></div><div class="card"><h2>الأساسيون 6</h2><div class="pitch"><div class="squad">${[0,1,2,3,4,5].map(i=>slot(starters[i])).join('')}</div></div><h2>الدكة 2</h2><div class="squad">${[0,1].map(i=>slot(bench[i],true)).join('')}</div></div><div class="card"><h2>الطاقات</h2><div class="chips">${[['triple_captain','الكبتن ×3'],['bench_boost','تفعيل الدكة'],['wildcard','تغيير شامل']].map(x=>`<button class="chip ${D.chip===x[0]?'on':''}" data-chip="${x[0]}" ${used.includes(x[0])?'disabled':''}>${x[1]}${used.includes(x[0])?' ✓':''}</button>`).join('')}</div></div><div class="savebar"><button id="save" class="btn yellow">حفظ التشكيلة</button></div>`;
$$('.player').forEach(x=>x.onclick=()=>{let id=+x.dataset.id;if(selected.has(id)){D.players=D.players.filter(y=>y.player_id!==id)}else{let p=P.find(y=>y.id===id);if(counts[p.group_no]>=2)return toast('اختر لاعبين فقط من المجموعة',true);if(D.players.length>=8)return toast('اكتملت القائمة',true);D.players.push({player_id:id,role:D.players.filter(y=>y.role==='starter').length<6?'starter':'bench',bench_order:1})}lineupPage()});
$$('[data-del]').forEach(x=>x.onclick=()=>{let id=+x.dataset.del;D.players=D.players.filter(y=>y.player_id!==id);if(D.captain_player_id===id)D.captain_player_id=0;if(D.vice_player_id===id)D.vice_player_id=0;lineupPage()});
$$('[data-move]').forEach(x=>x.onclick=()=>{let id=+x.dataset.move,o=D.players.find(y=>y.player_id===id);if(o.role==='starter'){if(D.players.filter(y=>y.role==='bench').length>=2)return toast('الدكة مكتملة',true);o.role='bench';if(D.captain_player_id===id)D.captain_player_id=0;if(D.vice_player_id===id)D.vice_player_id=0}else{if(D.players.filter(y=>y.role==='starter').length>=6)return toast('الأساسي مكتمل',true);o.role='starter'}lineupPage()});
$$('[data-cap]').forEach(x=>x.onclick=()=>{D.captain_player_id=+x.dataset.cap;if(D.vice_player_id===D.captain_player_id)D.vice_player_id=0;lineupPage()});$$('[data-vice]').forEach(x=>x.onclick=()=>{D.vice_player_id=+x.dataset.vice;if(D.captain_player_id===D.vice_player_id)D.captain_player_id=0;lineupPage()});$$('[data-chip]').forEach(x=>x.onclick=()=>{D.chip=D.chip===x.dataset.chip?null:x.dataset.chip;lineupPage()});
$('#save').onclick=async()=>{try{await api('/api/lineup/'+r.id,{method:'PUT',body:JSON.stringify(D)});toast('تم حفظ التشكيلة');S.boot=await api('/api/bootstrap');S.draft=null;lineupPage()}catch(e){toast(e.message,true)}}}
async function adminHome(){let d=await api('/api/admin/dashboard');$('#content').innerHTML=hero('لوحة المشرف','إدارة فانتسي دوائر من مكان واحد.')+`<div class="grid"><div class="stat"><b>${d.players}</b><span>لاعب</span></div><div class="stat"><b>${d.participants}</b><span>مشترك</span></div><div class="stat"><b>${d.rounds}</b><span>جولة</span></div><div class="stat"><b>${d.lineups}</b><span>تشكيلة</span></div></div>`}
async function players(){let a=await api('/api/admin/players');$('#content').innerHTML=`<div class="card"><h2>اللاعبون</h2><p class="muted">كل لاعب يمكن ربطه بحساب مشترك واحد. اليوزر المرتبط يظهر هنا بشكل واضح.</p><form id="addp" class="form"><input id="pn" class="input" placeholder="اسم اللاعب"><select id="pg"><option>1</option><option>2</option><option>3</option><option>4</option></select><button class="btn">إضافة</button></form></div><div class="card tablebox"><table class="table"><tr><th>الاسم</th><th>المجموعة</th><th>الحساب المرتبط</th><th>الحالة</th><th></th></tr>${a.map(x=>`<tr data-id="${x.id}"><td><input class="input n" value="${esc(x.name)}"></td><td><select class="g">${[1,2,3,4].map(g=>`<option ${x.group_no===g?'selected':''}>${g}</option>`).join('')}</select></td><td><b>${x.username?'@'+esc(x.username):'غير مربوط'}</b><div style="margin-top:7px"><button type="button" class="tiny linkbtn">${x.username?'تغيير/فك الربط':'ربط حساب'}</button> ${x.username?'':`<button type="button" class="tiny mk">إنشاء حساب</button>`}</div></td><td><select class="ac"><option value="1" ${x.active?'selected':''}>نشط</option><option value="0" ${!x.active?'selected':''}>موقوف</option></select></td><td><button class="btn sec sv">حفظ</button></td></tr>`).join('')}</table></div>`;
$('#addp').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/players',{method:'POST',body:JSON.stringify({name:$('#pn').value,group_no:+$('#pg').value})});toast('تمت إضافة اللاعب');players()}catch(x){toast(x.message,true)}};
$$('.sv').forEach(b=>b.onclick=async()=>{let t=b.closest('tr');try{await api('/api/admin/players/'+t.dataset.id,{method:'PUT',body:JSON.stringify({name:$('.n',t).value,group_no:+$('.g',t).value,active:$('.ac',t).value==='1'})});toast('تم الحفظ');players()}catch(x){toast(x.message,true)}});
$$('.linkbtn').forEach(b=>b.onclick=async()=>{let t=b.closest('tr'),x=a.find(v=>v.id===+t.dataset.id);let un=prompt('اكتب يوزر الحساب المراد ربطه. اتركه فارغاً لفك الربط.',x?.username||'');if(un===null)return;try{await api('/api/admin/players/'+t.dataset.id+'/link',{method:'POST',body:JSON.stringify({username:un.trim()})});toast(un.trim()?'تم ربط الحساب':'تم فك الربط');players()}catch(e){toast(e.message,true)}});
$$('.mk').forEach(b=>b.onclick=async()=>{let t=b.closest('tr');let un=prompt('اختر اليوزر للحساب الجديد:','player'+t.dataset.id);if(!un)return;let code=prompt('اختر رمز دخول للحساب (4 أحرف على الأقل):','');if(!code)return;try{let r=await api('/api/admin/players/'+t.dataset.id+'/account',{method:'POST',body:JSON.stringify({username:un.trim(),code:code})});toast('تم إنشاء الحساب @'+r.username+' وربطه باللاعب');players()}catch(e){toast(e.message,true)}})}
async function participants(){let a=await api('/api/admin/participants');$('#content').innerHTML=`<div class="card"><h2>المشتركون</h2><form id="addu" class="form"><input id="un" class="input" placeholder="اسم المشترك"><input id="uc" class="input" placeholder="رمز الدخول"><button class="btn">إضافة</button></form></div><div class="card tablebox"><table class="table"><tr><th>الاسم</th><th>آخر الرمز</th><th>الحالة</th></tr>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>•••${esc(x.code_hint||'')}</td><td>${x.active?'نشط':'موقوف'}</td></tr>`).join('')}</table></div>`;$('#addu').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/participants',{method:'POST',body:JSON.stringify({name:$('#un').value,code:$('#uc').value})});toast('تمت الإضافة');participants()}catch(x){toast(x.message,true)}}}
async function rounds(){let a=await api('/api/rounds');$('#content').innerHTML=`<div class="card"><h2>الجولات</h2><form id="addr" class="form"><input id="rn" class="input" type="number" placeholder="رقم الجولة"><input id="rname" class="input" placeholder="الاسم"><button class="btn">إنشاء</button></form></div><div class="card tablebox"><table class="table"><tr><th>#</th><th>الاسم</th><th>الحالة</th><th></th></tr>${a.map(x=>`<tr data-id="${x.id}"><td>${x.number}</td><td><input class="input n" value="${esc(x.name)}"></td><td><select class="st">${['draft','open','locked','scored'].map(s=>`<option ${x.status===s?'selected':''} value="${s}">${s}</option>`).join('')}</select></td><td><button class="btn sec sv">حفظ</button></td></tr>`).join('')}</table></div>`;$('#addr').onsubmit=async e=>{e.preventDefault();let n=+$('#rn').value;await api('/api/admin/rounds',{method:'POST',body:JSON.stringify({number:n,name:$('#rname').value||'الجولة '+n})});rounds()};$$('.sv').forEach(b=>b.onclick=async()=>{let t=b.closest('tr');await api('/api/admin/rounds/'+t.dataset.id,{method:'PUT',body:JSON.stringify({name:$('.n',t).value,status:$('.st',t).value})});toast('تم')})}
async function scores(){let rr=await api('/api/rounds'),rid=S.adminRound||rr[0]?.id;if(!rid)return $('#content').innerHTML='<div class="card">أنشئ جولة أولاً</div>';S.adminRound=rid;let a=await api('/api/admin/scores/'+rid);$('#content').innerHTML=`<div class="card"><h2>رصد النقاط</h2><select id="sr">${rr.map(x=>`<option value="${x.id}" ${x.id===rid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="card tablebox"><table class="table"><tr><th>اللاعب</th><th>هدف</th><th>فوز</th><th>هاتريك</th><th>حضور</th><th>أفضل</th><th>أصفر</th><th>أحمر</th><th>بدون حذاء</th><th>عكسي</th><th>نقاط</th></tr>${a.map(x=>`<tr data-id="${x.player_id}"><td>${esc(x.name)}</td>${['goals','wins','hattricks'].map(k=>`<td><input class="input ${k}" type="number" min="0" value="${x[k]}"></td>`).join('')}<td><input class="attendance" type="checkbox" ${x.attendance?'checked':''}></td>${['best_player','yellow','red','no_shoes','own_goals'].map(k=>`<td><input class="input ${k}" type="number" min="0" value="${x[k]}"></td>`).join('')}<td><b>${x.raw_points}</b></td></tr>`).join('')}</table></div><div class="savebar"><button id="ss" class="btn yellow">حفظ الرصد</button></div>`;$('#sr').onchange=()=>{S.adminRound=+$('#sr').value;scores()};$('#ss').onclick=async()=>{let list=$$('.table tr[data-id]').map(t=>{let o={player_id:+t.dataset.id,attendance:$('.attendance',t).checked?1:0};['goals','wins','hattricks','best_player','yellow','red','no_shoes','own_goals'].forEach(k=>o[k]=+$('.'+k,t).value||0);return o});await api('/api/admin/scores/'+rid,{method:'PUT',body:JSON.stringify({scores:list})});toast('تم حفظ النقاط')}}
async function settingsAdmin(){let s=await api('/api/admin/settings');let f=[['captain_multiplier','مضاعف الكبتن'],['free_transfers','التغييرات المجانية'],['points_goal','الهدف'],['points_win','الفوز'],['points_hattrick','الهاتريك'],['points_attendance','الحضور'],['points_best_player','أفضل لاعب'],['points_yellow','الأصفر'],['points_red','الأحمر'],['points_no_shoes','بدون حذاء'],['points_own_goal','هدف عكسي']];$('#content').innerHTML=`<div class="card"><h2>الإعدادات</h2><form id="sf" class="form">${f.map(x=>`<label>${x[1]}<input id="${x[0]}" class="input" type="number" value="${s[x[0]]}"></label>`).join('')}<button class="btn">حفظ</button></form></div><div class="card"><h2>تغيير كلمة المرور</h2><form id="pf" class="form"><input id="cur" class="input" type="password" placeholder="الحالية"><input id="next" class="input" type="password" placeholder="الجديدة"><button class="btn sec">تغيير</button></form></div><div class="card"><a class="btn sec" href="/api/admin/backup" target="_blank">نسخة احتياطية JSON</a></div>`;$('#sf').onsubmit=async e=>{e.preventDefault();let b={};f.forEach(x=>b[x[0]]=+$('#'+x[0]).value);await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(b)});toast('تم الحفظ');S.boot=await api('/api/bootstrap')};$('#pf').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/password',{method:'PUT',body:JSON.stringify({current:$('#cur').value,next:$('#next').value})});toast('تم التغيير')}catch(x){toast(x.message,true)}}}
start().catch(e=>{document.body.innerHTML='<pre>'+esc(e.message)+'</pre>'});
</script></body></html>
