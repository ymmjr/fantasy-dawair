/* Full mobile experience */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button,a,input,select,textarea{touch-action:manipulation}
button,a{-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.grid>*,.two>* ,.form>* ,.player-pool>* ,.admin-lineups>*{min-width:0}
.table input,.table select{min-width:0}
.mobile-table-label{display:none}

@media(max-width:700px){
  body{background:linear-gradient(180deg,#06283b 0,#03131f 260px,#020c14 100%)}
  .wrap{width:100%;padding-inline:12px}
  .top{position:sticky;top:0;z-index:20}
  .top .wrap{padding:8px 12px;gap:8px}
  .top-main{gap:8px;min-width:0;overflow:hidden}
  .brand{gap:7px;font-size:15px;min-width:0;line-height:1.2}
  .brand>div{display:none}
  .brand-logo{width:42px;height:42px;border-radius:12px}
  #logout{padding:9px 10px;min-height:42px;white-space:nowrap;flex:0 0 auto}
  main.wrap{padding-bottom:24px}
  .top .nav{display:flex;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;gap:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0}
  .top .nav::-webkit-scrollbar{display:none}
  .top .nav a{flex:0 0 auto;scroll-snap-align:start;min-height:40px;padding:8px 11px;border-radius:999px;font-size:12px;white-space:nowrap}
  .section-nav-shell{top:59px}
  .section-nav-shell .wrap{padding:7px 12px}
  .section-subnav{flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none}
  .section-subnav::-webkit-scrollbar{display:none}
  .section-subnav button{flex:0 0 auto;min-height:40px;padding:8px 12px;border-radius:999px;font-size:12px;white-space:nowrap}
  .card{border-radius:17px;padding:14px;margin:12px 0;box-shadow:0 10px 30px #0004}
  .hero{padding:20px 16px;min-height:0}
  .hero:after{width:180px;height:180px;border-width:24px}
  .hero h1{font-size:30px;line-height:1.15;margin-bottom:8px;text-shadow:none}
  .hero p{margin:0;line-height:1.7;font-size:14px}
  .home-hero{grid-template-columns:1fr auto;gap:12px}
  .hero-logo{width:78px;height:78px;border-radius:18px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .stat{border-radius:14px;padding:12px}
  .stat b{font-size:22px;overflow-wrap:anywhere}
  .stat span{font-size:12px}
  .two{grid-template-columns:1fr;gap:0}
  .form{grid-template-columns:1fr;gap:9px}
  .input,select,textarea{font-size:16px;min-height:46px;padding:11px 12px}
  .btn{min-height:44px;padding:10px 14px}
  .tiny{min-height:40px;padding:8px 10px;font-size:12px}
  .chips{display:grid;grid-template-columns:1fr;gap:8px}
  .chip{min-height:46px}
  .rule{align-items:center;padding:12px;line-height:1.45}
  .login{min-height:100dvh;padding:0}
  .loginbox{width:100%;min-height:100dvh;border:0;border-radius:0;grid-template-columns:1fr;background:#061d30}
  .loginart{padding:28px 18px 20px;min-height:38dvh}
  .loginart h1{margin:12px 0 5px}
  .login-logo{width:min(145px,38vw);border-radius:22px}
  .loginform{padding:24px 18px max(28px,env(safe-area-inset-bottom))}
  .loginform h1{font-size:27px;margin-top:0}
  .toast{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));text-align:center;z-index:100;padding:13px}
  .savebar{bottom:max(8px,env(safe-area-inset-bottom));z-index:12;margin-inline:-4px;padding:8px;border-radius:14px}
  .savebar .btn{width:100%;min-height:50px}

  /* Mobile fantasy pitch: exactly two centered players per row */
  .squad-builder{border-radius:20px;padding:10px 7px 12px;margin-inline:-3px}
  .pitch-title{font-size:17px;margin:4px 0 10px}
  .pitch{min-height:0;border-radius:17px;padding:18px 5px 15px}
  .pitch:before{inset:10px}
  .pitch:after{width:76px;height:76px}

async function loadLineup(x,ext){

  try{
    let d=await api('/api/admin/people/'+encodeURIComponent(x.key)),selected=null;
    if(d.participant)selected=(d.lineups||[]).find(v=>x.round_id&&v.round.id===x.round_id)||(d.lineups||[]).find(v=>v.lineup)||(d.lineups||[])[0]||null;
    let inner='';
    if(!d.participant)inner='<div class="people-lineup-empty">هذا اللاعب غير مربوط بحساب مشترك حتى الآن.</div>';
    else if(!selected||!selected.lineup)inner=`<div class="people-lineup-head"><b>التشكيلة الحالية</b><span class="people-lineup-total">لم يسلّم</span></div><div class="people-lineup-empty">لا توجد تشكيلة لهذه الجولة حتى الآن.</div>`;

      let l=selected.lineup,scores=[];
      try{scores=await api('/api/admin/scores/'+selected.round.id)}catch(e){}
      let pts=new Map((scores||[]).map(v=>[v.player_id,v.raw_points||0])),st=l.players.filter(v=>v.role==='starter'),be=l.players.filter(v=>v.role==='bench');

}

async function players(){let [a,u]=await Promise.all([api('/api/admin/players'),api('/api/admin/participants')]);$('#content').innerHTML=`<div class="card"><h2>اللاعبون</h2><p class="muted">أي إضافة أو تغيير في المجموعة يتم حفظه للجولة القادمة فقط إذا كانت هناك جولة مفتوحة حالياً. توزيع الجولة الحالية يبقى ثابتاً حتى نهايتها.</p><input id="playersSearch" class="input search-box" placeholder="ابحث باسم اللاعب أو الحساب"><form id="addp" class="form"><input id="pn" class="input" placeholder="اسم اللاعب"><select id="pg"><option>1</option><option>2</option><option>3</option><option>4</option></select><button class="btn">إضافة</button></form></div><div class="card tablebox"><table class="table"><tr><th>الصورة</th><th>اسم اللاعب</th><th>المجموعة</th><th>حساب المشترك المرتبط</th><th>الحالة</th><th></th></tr>${a.map(x=>{let choices=u.filter(v=>!v.player_id||v.player_id===x.id);return `<tr data-id="${x.id}" data-search="${esc(x.name+' '+(x.participant_name||'')+' '+(x.username||''))}"><td>${avatar(x.profile_image,'avatar',x.name)}</td><td><input class="input n" value="${esc(x.name)}"></td><td><select class="g">${[1,2,3,4].map(g=>`<option ${x.group_no===g?'selected':''}>${g}</option>`).join('')}</select>${x.current_group_no?`<div class="muted" style="margin-top:6px">الحالية: م${x.current_group_no}${x.current_group_no!==x.group_no?` · القادمة: م${x.group_no}`:''}</div>`:(S.boot?.current_round?.status==='open'?'<div class="muted" style="margin-top:6px">يبدأ من الجولة القادمة</div>':'')}</td><td><select class="account"><option value="0">— غير مربوط —</option>${choices.map(v=>`<option value="${v.id}" ${x.participant_id===v.id?'selected':''}>${esc(v.name)} — @${esc(v.username||'')}</option>`).join('')}</select>${x.participant_id?`<div class="muted" style="margin-top:6px">مرتبط الآن: ${esc(x.participant_name||x.name)} · @${esc(x.username||'')}</div>`:`<button type="button" class="tiny mk" style="margin-top:7px">إنشاء حساب لهذا اللاعب</button>`}</td><td><select class="ac"><option value="1" ${x.active?'selected':''}>نشط</option><option value="0" ${!x.active?'selected':''}>موقوف</option></select></td><td><button class="btn sec sv">حفظ</button></td></tr>`}).join('')}</table></div>`;

async function participants(){let a=await api('/api/admin/participants');$('#content').innerHTML=`<div class="card"><h2>حسابات المستخدمين</h2><p class="muted">كل حساب يبدأ كمشارك عادي. تقدر ترقيه لمسؤول بدون ما يفقد صلاحيات المشاركة. زر واتساب يجهّز رسالة الترحيب المعتمدة تلقائياً، والحذف يحذف الحساب وتشكيلاته لكنه يترك اللاعب نفسه موجوداً وغير مربوط بحساب.</p><input id="participantsSearch" class="input search-box" placeholder="ابحث باسم المشترك أو اليوزر"><form id="addu" class="form"><input id="un" class="input" placeholder="اسم المشترك"><input id="uu" class="input" placeholder="Username — يمكن استخدام مسافة"><input id="uc" class="input" placeholder="كلمة المرور"><button class="btn">إنشاء حساب</button></form></div><div class="card tablebox"><table class="table"><tr><th>الاسم</th><th>اليوزر</th><th>اللاعب المرتبط</th><th>كلمة المرور الحالية</th><th>كلمة مرور جديدة</th><th>الصلاحية</th><th>الحالة</th><th>الإجراءات</th></tr>${a.map(x=>`<tr data-id="${x.id}" data-search="${esc(x.name+' '+(x.username||'')+' '+(x.player_name||''))}"><td><div class="name-with-wa"><button type="button" class="wa-btn" data-wa="${x.id}" title="إرسال بيانات الدخول عبر واتساب" aria-label="واتساب">☎</button><input class="input n" value="${esc(x.name)}"></div></td><td><input class="input u" dir="ltr" value="${esc(x.username||'')}"></td><td>${x.player_name?esc(x.player_name):'<span class="muted">غير مربوط</span>'}</td><td><input class="input" dir="ltr" readonly value="${esc(x.code_full||'غير متاح')}"></td><td><input class="input code" placeholder="اتركه فارغاً" autocomplete="new-password"></td><td><select class="role"><option value="0" ${!x.is_admin?'selected':''}>مشارك</option><option value="1" ${x.is_admin?'selected':''}>مسؤول</option></select></td><td><select class="ac"><option value="1" ${x.active?'selected':''}>نشط</option><option value="0" ${!x.active?'selected':''}>موقوف</option></select><div class="muted">الحالي: •••${esc(x.code_hint||'')}</div></td><td><div class="account-actions"><button class="btn sec sv">حفظ</button><button type="button" class="tiny danger-btn del-account" ${S.me.participant_id===x.id?'disabled title="لا يمكنك حذف الحساب المستخدم حالياً"':''}>حذف</button></div></td></tr>`).join('')}</table></div>`;
bindSearch('#participantsSearch','.table tr[data-id]');

$$('.sv').forEach(b=>b.onclick=async()=>{let t=b.closest('tr');let body={name:$('.n',t).value,username:$('.u',t).value,is_admin:$('.role',t).value==='1',active:$('.ac',t).value==='1'};if($('.code',t).value)body.code=$('.code',t).value;try{await api('/api/admin/participants/'+t.dataset.id,{method:'PUT',body:JSON.stringify(body)});toast(body.is_admin?'تم الحفظ وترقية الصلاحية':'تم حفظ الحساب');refreshParticipants()}catch(x){toast(x.message,true)}});
$$('.del-account').forEach(b=>b.onclick=async()=>{let t=b.closest('tr'),x=a.find(v=>v.id===+t.dataset.id);if(!x)return;if(!confirm('حذف حساب '+x.name+'؟\n\nسيتم حذف الحساب وجميع تشكيلاته في الجولات، بينما سيبقى اللاعب نفسه موجوداً في قائمة اللاعبين وغير مربوط بحساب.'))return;try{await api('/api/admin/participants/'+x.id,{method:'DELETE'});toast('تم حذف الحساب');refreshParticipants()}catch(e){toast(e.message,true)}})}
async function rounds(){let a=await api('/api/rounds');$('#content').innerHTML=`<div class="card"><h2>الجولات</h2><p class="muted">حدد موعد إغلاق تسليم التشكيلات بتوقيت الكويت. بعد الموعد يمنع النظام تعديل الجولة تلقائياً.</p><form id="addr" class="form"><input id="rn" class="input" type="number" placeholder="رقم الجولة"><input id="rname" class="input" placeholder="الاسم"><input id="rlock" class="input" type="datetime-local" aria-label="موعد انتهاء الجولة"><button class="btn">إنشاء</button></form></div><div class="card tablebox"><table class="table"><tr><th>#</th><th>الاسم</th><th>الحالة</th><th>انتهاء الجولة</th><th></th></tr>${a.map(x=>`<tr data-id="${x.id}"><td>${x.number}</td><td><input class="input n" value="${esc(x.name)}"></td><td><select class="st">${['draft','open','locked','scored'].map(s=>`<option ${x.status===s?'selected':''} value="${s}">${s}</option>`).join('')}</select></td><td><input class="input lk" type="datetime-local" value="${isoToKuwaitInput(x.lock_at)}"><div class="muted" style="margin-top:5px">${x.lock_at?esc(fmtDeadline(x.lock_at)):'غير محدد'} · الكويت</div></td><td><button class="btn sec sv">حفظ</button></td></tr>`).join('')}</table></div>`;$('#addr').onsubmit=async e=>{e.preventDefault();let n=+$('#rn').value;try{await api('/api/admin/rounds',{method:'POST',body:JSON.stringify({number:n,name:$('#rname').value||'الجولة '+n,lock_at:kuwaitInputToIso($('#rlock').value)})});toast('تم إنشاء الجولة');refreshRounds()}catch(x){toast(x.message,true)}};$$('.sv').forEach(b=>b.onclick=async()=>{let t=b.closest('tr');try{await api('/api/admin/rounds/'+t.dataset.id,{method:'PUT',body:JSON.stringify({name:$('.n',t).value,status:$('.st',t).value,lock_at:kuwaitInputToIso($('.lk',t).value)})});toast('تم حفظ موعد الجولة');S.boot=await api('/api/bootstrap');refreshRounds()}catch(x){toast(x.message,true)}})}
async function adminLineups(){let rr=await api('/api/rounds'),rid=S.adminLineupRound||rr[0]?.id;if(!rid)return $('#content').innerHTML='<div class="card">أنشئ جولة أولاً</div>';S.adminLineupRound=rid;let d=await api('/api/admin/lineups/'+rid),chipLabel={triple_captain:'الكبتن ×3',bench_boost:'تفعيل الدكة',wildcard:'تغيير شامل'};let playerCard=(p,l)=>`<div class="p">${avatar(p.profile_image,'avatar',p.name)}<b>${esc(p.name)} ${l.captain_player_id===p.player_id?'<span class="capmark">C</span>':''}${l.vice_player_id===p.player_id?'<span class="vicemark">VC</span>':''}</b><span class="muted">المجموعة ${p.group_no}</span></div>`;$('#content').innerHTML=hero('تشكيلات المشتركين','عرض تشكيلات جميع المشتركين في أي جولة.')+`<div class="card"><label>الجولة</label><select id="lr">${rr.map(x=>`<option value="${x.id}" ${x.id===rid?'selected':''}>${esc(x.name)} — ${esc(x.status)}</option>`).join('')}</select><input id="lineupsSearch" class="input search-box" placeholder="ابحث باسم المشترك أو اليوزر"></div><div class="admin-lineups">${d.items.map(x=>{let l=x.lineup;if(!l)return `<div class="lineup-card" data-search="${esc(x.participant.name+' '+(x.participant.username||''))}"><div class="lineup-head">${avatar(x.participant.profile_image,'avatar-lg',x.participant.name)}<div class="meta"><h3>${esc(x.participant.name)}</h3><div class="muted">@${esc(x.participant.username||'')} · لم يسلّم تشكيلة</div></div></div></div>`;let st=l.players.filter(p=>p.role==='starter'),be=l.players.filter(p=>p.role==='bench');return `<div class="lineup-card" data-search="${esc(x.participant.name+' '+(x.participant.username||''))}"><div class="lineup-head">${avatar(x.participant.profile_image,'avatar-lg',x.participant.name)}<div class="meta"><h3>${esc(x.participant.name)}</h3><div class="muted">@${esc(x.participant.username||'')} · ${x.score} نقطة</div></div></div><div class="muted">الأساسيون</div><div class="lineup-mini">${st.map(p=>playerCard(p,l)).join('')}</div><div class="bench-title">الدكة</div><div class="lineup-mini">${be.map(p=>playerCard(p,l)).join('')}</div>${l.chip?`<div class="lineup-chip">الطاقة: ${esc(chipLabel[l.chip]||l.chip)}</div>`:''}</div>`}).join('')}</div>`;bindSearch('#lineupsSearch','.lineup-card');$('#lr').onchange=()=>{S.adminLineupRound=+$('#lr').value;refreshLineups()}}
async function scores(){let rr=await api('/api/rounds'),rid=S.adminRound||rr[0]?.id;if(!rid)return $('#content').innerHTML='<div class="card">أنشئ جولة أولاً</div>';S.adminRound=rid;let a=await api('/api/admin/scores/'+rid);$('#content').innerHTML=`<div class="card"><h2>رصد النقاط</h2><select id="sr">${rr.map(x=>`<option value="${x.id}" ${x.id===rid?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input id="scoresSearch" class="input search-box" placeholder="ابحث باسم اللاعب"></div><div class="card tablebox"><table class="table"><tr><th>اللاعب</th><th>هدف</th><th>فوز</th><th>هاتريك</th><th>حضور</th><th>أفضل</th><th>أصفر</th><th>أحمر</th><th>بدون حذاء</th><th>عكسي</th><th>نقاط</th></tr>${a.map(x=>`<tr data-id="${x.player_id}" data-search="${esc(x.name)}"><td>${esc(x.name)}</td>${['goals','wins','hattricks'].map(k=>`<td><input class="input ${k}" type="number" min="0" value="${x[k]}"></td>`).join('')}<td><input class="attendance" type="checkbox" ${x.attendance?'checked':''}></td>${['best_player','yellow','red','no_shoes','own_goals'].map(k=>`<td><input class="input ${k}" type="number" min="0" value="${x[k]}"></td>`).join('')}<td><b>${x.raw_points}</b></td></tr>`).join('')}</table></div><div class="savebar"><button id="ss" class="btn yellow">حفظ الرصد</button></div>`;bindSearch('#scoresSearch','.table tr[data-id]');$('#sr').onchange=()=>{S.adminRound=+$('#sr').value;refreshScores()};$('#ss').onclick=async()=>{let list=$$('.table tr[data-id]').map(t=>{let o={player_id:+t.dataset.id,attendance:$('.attendance',t).checked?1:0};['goals','wins','hattricks','best_player','yellow','red','no_shoes','own_goals'].forEach(k=>o[k]=+$('.'+k,t).value||0);return o});await api('/api/admin/scores/'+rid,{method:'PUT',body:JSON.stringify({scores:list})});toast('تم حفظ النقاط')}}
async function settingsAdmin(){let s=await api('/api/admin/settings');let f=[['captain_multiplier','مضاعف الكبتن'],['free_transfers','التغييرات المجانية'],['points_goal','الهدف'],['points_win','الفوز'],['points_hattrick','الهاتريك'],['points_attendance','الحضور'],['points_best_player','أفضل لاعب'],['points_yellow','الأصفر'],['points_red','الأحمر'],['points_no_shoes','بدون حذاء'],['points_own_goal','هدف عكسي']];$('#content').innerHTML=`<div class="card"><h2>الإعدادات</h2><form id="sf" class="form">${f.map(x=>`<label>${x[1]}<input id="${x[0]}" class="input" type="number" value="${s[x[0]]}"></label>`).join('')}<button class="btn">حفظ</button></form></div><div class="card"><h2>تغيير كلمة المرور</h2><form id="pf" class="form"><input id="cur" class="input" type="password" placeholder="الحالية"><input id="next" class="input" type="password" placeholder="الجديدة"><button class="btn sec">تغيير</button></form></div>`;$('#sf').onsubmit=async e=>{e.preventDefault();let b={};f.forEach(x=>b[x[0]]=+$('#'+x[0]).value);await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(b)});toast('تم الحفظ');S.boot=await api('/api/bootstrap')};$('#pf').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/password',{method:'PUT',body:JSON.stringify({current:$('#cur').value,next:$('#next').value})});toast('تم التغيير')}catch(x){toast(x.message,true)}}}
