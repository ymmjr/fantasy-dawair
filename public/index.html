<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061b2d"><link rel="icon" type="image/jpeg" href="/assets/dawair-logo.jpg"><title>فانتسي دوائر</title>
<style>
:root{--bg:#03131f;--panel:#08283d;--panel2:#0c354f;--cyan:#16d8e8;--cyan2:#77f4ff;--text:#eefcff;--muted:#9fc4d4;--yellow:#ffd43b;--red:#ff6b78;--green:#6ce5a1}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#0c4763 0,#041927 34%,#020c14 100%);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}.wrap{width:min(1180px,94vw);margin:auto}.top{position:sticky;top:0;z-index:5;background:#031522ee;border-bottom:1px solid #17617e;backdrop-filter:blur(14px)}.top .wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 0}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px}.brand-logo{width:58px;height:58px;object-fit:cover;border-radius:17px;border:1px solid #7ee8df55;box-shadow:0 0 28px #13d8e833}.login-logo{width:min(250px,82%);aspect-ratio:1;object-fit:cover;border-radius:30px;box-shadow:0 22px 55px #0005;border:1px solid #ffffff33}.home-hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:22px}.hero-logo{width:150px;height:150px;object-fit:cover;border-radius:28px;box-shadow:0 18px 45px #0005;border:1px solid #ffffff33;position:relative;z-index:2}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--cyan2),#18aee1);color:#002033;text-decoration:none;display:inline-block}.btn.sec{background:#0a2c43;color:#dffaff;border:1px solid #1d6d8d}.btn.yellow{background:linear-gradient(135deg,#ffe875,#ffbd2e);color:#2b1900}.btn:disabled{opacity:.45}.card{background:linear-gradient(180deg,#0b3049ee,#061d31ee);border:1px solid #1d6584;border-radius:22px;padding:18px;margin:16px 0;box-shadow:0 18px 50px #0005}.hero{padding:28px;border-color:#20dce8;background:linear-gradient(125deg,#0b3e59,#061c2d);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:300px;height:300px;border:40px solid #16d8e81b;border-radius:50%;left:-100px;top:-100px}.hero h1{font-size:clamp(34px,6vw,64px);margin:0 0 12px;text-shadow:0 4px #00314b}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 0}.nav a{background:#082a42;color:#cff7ff;border:1px solid #1c6887;border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:800;text-decoration:none;display:inline-flex;align-items:center}.nav a.on{background:var(--cyan);color:#00263a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#082a42;border:1px solid #1d6584;border-radius:17px;padding:15px}.stat b{display:block;font-size:28px;color:var(--cyan2)}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.rules{display:grid;gap:8px}.rule{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;background:#061b2d;border:1px solid #164e68;border-radius:12px}.pos strong{color:var(--green)}.neg strong{color:#ff9ba5}.tablebox{overflow:auto;border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #174c65;text-align:right}.table th{background:#0c3650;color:#bfefff}.input,select,textarea{width:100%;background:#031724;color:white;border:1px solid #246986;border-radius:11px;padding:10px;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--cyan)}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(840px,96vw);display:grid;grid-template-columns:1fr 1fr;background:#061d30;border:1px solid #23ddeb;border-radius:28px;overflow:hidden}.loginart{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:35px;background:linear-gradient(155deg,#0c526f,#062338);text-align:center}.ball{display:none}.loginform{padding:34px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.hidden{display:none!important}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.group{background:#071f32;border:1px solid #17546f;border-radius:16px;padding:10px}.player{display:flex;align-items:center;gap:8px;padding:9px;margin:6px 0;border:1px solid #164b63;border-radius:11px;cursor:pointer;background:#061826}.player.sel{border-color:var(--cyan);background:#0c4057}.badge{margin-right:auto;border-radius:999px;padding:3px 7px;background:#10435c;color:#bcefff}.squad-builder{position:relative;overflow:hidden;border-radius:28px;padding:18px;background:radial-gradient(circle at 50% 0,#6936c866 0,transparent 34%),linear-gradient(155deg,#0ac7d8 0,#3467d7 45%,#7628cf 100%);border:1px solid #ffffff35;box-shadow:0 24px 70px #0006}.squad-builder:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 18%,#4ff5e955 0 10%,transparent 28%),radial-gradient(circle at 85% 8%,#9e56ff55 0 12%,transparent 32%);pointer-events:none}.pitch-title{position:relative;z-index:1;text-align:center;margin:2px 0 14px;font-size:22px;font-weight:900}.pitch{position:relative;z-index:1;background:linear-gradient(#168b58ee,#14794fee),repeating-linear-gradient(0deg,transparent 0 74px,#ffffff0d 75px 148px);border:2px solid #ffffff9c;border-radius:24px;padding:24px 15px 18px;min-height:520px;box-shadow:inset 0 0 0 1px #ffffff1c}.pitch:before{content:"";position:absolute;inset:20px;border:2px solid #ffffffa8;border-radius:4px;pointer-events:none}.pitch:after{content:"";position:absolute;width:112px;height:112px;border:2px solid #ffffffa8;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}.pitch-row{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;justify-items:center}.pitch-row+.pitch-row{margin-top:42px}.fantasy-card-wrap{width:min(150px,100%);text-align:center;position:relative}.fantasy-card{position:relative;min-height:190px;padding:14px 10px 13px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:linear-gradient(160deg,#f3e9c7 0,#c9a95d 42%,#6d4e16 100%);clip-path:polygon(12% 0,88% 0,100% 12%,94% 84%,50% 100%,6% 84%,0 12%);filter:drop-shadow(0 10px 10px #0006);color:#10263c;overflow:hidden}.fantasy-card:before{content:"";position:absolute;inset:4px;background:linear-gradient(160deg,#fff8ddcc,#d9bc71bb 48%,#6d4e16bb);clip-path:inherit;z-index:-1}.fantasy-photo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #ffffffcc;background:#0c3650;box-shadow:0 5px 18px #0004}.fantasy-photo-fallback{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:43px;background:#0c3650;color:white;border:3px solid #ffffffcc}.fantasy-name{font-weight:900;font-size:14px;margin-top:7px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fantasy-points{font-weight:900;font-size:13px;margin-top:3px}.fantasy-group{font-size:10px;opacity:.78;margin-top:2px}.role-badges{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:3}.role-badge{min-width:28px;height:28px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-weight:900;font-size:11px;box-shadow:0 3px 8px #0004}.role-badge.cap{background:#ffd43b;color:#2b1900}.role-badge.vice{background:#e9fbff;color:#09334a}.fantasy-actions{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:7px}.fantasy-actions .tiny{background:#041827dd}.swap-pick .fantasy-card{outline:4px solid #ffd43b;outline-offset:3px}.empty-card{width:min(150px,100%);min-height:190px;border:2px dashed #ffffff80;border-radius:20px;display:grid;place-items:center;color:#dffaff;background:#04352d66}.bench-zone{position:relative;z-index:1;margin-top:16px;background:#051b2ddd;border:1px solid #ffffff2e;border-radius:20px;padding:14px}.bench-zone h3{margin:0 0 10px}.bench-grid{display:grid;grid-template-columns:repeat(2,minmax(0,170px));justify-content:center;gap:18px}.selection-summary{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.selection-pill{background:#051b2dcc;border:1px solid #ffffff45;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}.selection-pill.ok{background:#0f5b45dd;border-color:#76f1b2}.selection-pill.warn{background:#6f4d0cdd;border-color:#ffd86b}.swap-help{position:relative;z-index:1;text-align:center;margin:10px 0 0;padding:9px 12px;border-radius:12px;background:#031724bb;border:1px solid #ffd43b;color:#fff1a6}.player-pool{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.pool-group{background:#071f32;border:1px solid #17546f;border-radius:18px;padding:12px}.pool-player{display:flex;align-items:center;gap:8px;padding:8px;margin:6px 0;border:1px solid #164b63;border-radius:12px;cursor:pointer;background:#061826;transition:.15s}.pool-player:hover{transform:translateY(-1px);border-color:#25d5e3}.pool-player.sel{border-color:#77f4ff;background:#0c4057}.pool-player .pool-meta{min-width:0}.pool-player b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pool-player small{color:var(--muted)}.pool-player .avatar{width:40px;height:40px}.squad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.slot{background:#05283bd9;border:1px solid #2fcddc;border-radius:14px;padding:10px;text-align:center;min-height:105px}.slot .shirt{font-size:30px}.tiny{padding:6px 8px;border-radius:9px;border:1px solid #27718c;background:#08283d;color:white;cursor:pointer;font-size:12px}.tiny.on{background:var(--yellow);color:#2b1900}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1px solid #26708e;border-radius:12px;background:#07283e;color:#defbff;cursor:pointer}.chip.on{background:#ffd43b;color:#261700}.toast{position:fixed;left:18px;bottom:18px;background:#071b29;border:1px solid #22d9e8;padding:12px 16px;border-radius:12px;z-index:50;display:none}.toast.bad{border-color:#ff6674}.savebar{position:sticky;bottom:10px;padding:10px;background:#041827dd;border:1px solid #1d6584;border-radius:16px;margin-top:12px;text-align:center}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid #2b7894;background:#0a2d43}.avatar-lg{width:82px;height:82px;border-radius:50%;object-fit:cover;border:3px solid var(--cyan);background:#0a2d43;box-shadow:0 8px 24px #0005}.avatar-profile{width:150px;height:150px;border-radius:32px;object-fit:cover;border:3px solid var(--cyan);background:#0a2d43;box-shadow:0 15px 38px #0005}.avatar-fallback{display:inline-grid;place-items:center;font-size:24px}.avatar-lg.avatar-fallback{font-size:38px}.avatar-profile.avatar-fallback{font-size:64px}.profile-box{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.profile-actions{display:flex;gap:8px;flex-wrap:wrap}.rank-person{display:flex;align-items:center;gap:10px}.admin-lineups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.lineup-card{background:#061b2d;border:1px solid #1d6584;border-radius:18px;padding:15px}.lineup-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}.lineup-head .meta{min-width:0}.lineup-head h3{margin:0 0 4px}.lineup-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lineup-mini .p{background:#08283d;border:1px solid #174c65;border-radius:12px;padding:8px;text-align:center}.lineup-mini .p b{display:block;font-size:13px;margin-top:4px}.capmark{display:inline-block;background:#ffd43b;color:#2b1900;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:900;margin-inline-start:4px}.vicemark{display:inline-block;background:#d7f9ff;color:#063047;border-radius:999px;padding:2px 6px;font-size:10px;font-weight:900;margin-inline-start:4px}.bench-title{margin:12px 0 7px;color:var(--muted);font-size:13px}.lineup-chip{display:inline-block;margin-top:10px;border:1px solid #27718c;border-radius:999px;padding:5px 9px;font-size:12px}
@media(max-width:800px){.loginbox{grid-template-columns:1fr}.loginart{display:flex;padding:22px}.login-logo{width:150px}.home-hero{grid-template-columns:1fr}.hero-logo{width:110px;height:110px}.grid,.groups{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.form{grid-template-columns:1fr}.squad{grid-template-columns:repeat(2,1fr)}.admin-lineups{grid-template-columns:1fr}.lineup-mini{grid-template-columns:repeat(2,1fr)}.player-pool{grid-template-columns:repeat(2,minmax(0,1fr))}.pitch{min-height:440px;padding:18px 8px}.pitch-row{gap:7px}.fantasy-card-wrap{width:min(112px,100%)}.fantasy-card{min-height:150px;padding:10px 6px}.fantasy-photo,.fantasy-photo-fallback{width:70px;height:70px}.fantasy-photo-fallback{font-size:34px}.fantasy-name{font-size:12px;max-width:96px}.fantasy-points{font-size:11px}.pitch-row+.pitch-row{margin-top:30px}}@media(max-width:520px){.player-pool{grid-template-columns:1fr}.pitch-row{grid-template-columns:repeat(2,minmax(0,1fr))}.pitch-row .fantasy-card-wrap:last-child:nth-child(odd){grid-column:1/-1}.bench-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.selection-pill{font-size:11px;padding:6px 9px}}
</style>

<body><div id="toast" class="toast"></div><div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const S={me:null,boot:null,page:null,draft:null,adminRound:null,adminLineupRound:null,swapPlayer:null,pendingPath:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async(p,o={})=>{o.headers={'Content-Type':'application/json',...(o.headers||{})};let r=await fetch(p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'حدث خطأ');return j};
function toast(t,b=false){let x=$('#toast');x.textContent=t;x.className='toast'+(b?' bad':'');x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
const ROUTES={
participant:[
{key:'home',path:'/dashboard',label:'الرئيسية',view:home},
{key:'lineup',path:'/lineup',label:'تشكيلتي',view:lineupPage},
{key:'board',path:'/leaderboard',label:'الترتيب',view:board},
{key:'rules',path:'/rules',label:'القوانين',view:rules},
{key:'account',path:'/account',label:'حسابي',view:accountPage}
],
admin:[
{key:'home',path:'/admin/dashboard',label:'الرئيسية',view:adminHome},
{key:'players',path:'/admin/players',label:'اللاعبون',view:players},
{key:'participants',path:'/admin/participants',label:'المشتركون',view:participants},
{key:'rounds',path:'/admin/rounds',label:'الجولات',view:rounds},
{key:'lineups',path:'/admin/lineups',label:'التشكيلات',view:adminLineups},
{key:'scores',path:'/admin/scores',label:'رصد النقاط',view:scores},
{key:'settings',path:'/admin/settings',label:'الإعدادات',view:settingsAdmin}
]
};
const activeRoutes=()=>ROUTES[S.me?.role==='admin'?'admin':'participant'];
const defaultPath=()=>S.me?.role==='admin'?'/admin/dashboard':'/dashboard';
const routeForPath=path=>activeRoutes().find(x=>x.path===path);
const isAuthorizedPath=path=>!!routeForPath(path);
function navigate(path,replace=false){if(!S.me?.authenticated)return;history[replace?'replaceState':'pushState']({},'',path);renderRoute()}
function show(key){let r=activeRoutes().find(x=>x.key===key);navigate(r?r.path:defaultPath())}
async function renderRoute(){let r=routeForPath(location.pathname);if(!r){history.replaceState({},'',defaultPath());r=routeForPath(location.pathname)}S.page=r.key;[...document.querySelectorAll('#nav a')].forEach(x=>x.classList.toggle('on',x.getAttribute('href')===r.path));document.title=r.label+' — فانتسي دوائر';await r.view()}
document.addEventListener('click',e=>{let a=e.target.closest('a[data-route]');if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;e.preventDefault();navigate(a.getAttribute('href'))});
window.addEventListener('popstate',()=>{if(S.me?.authenticated)renderRoute();else{history.replaceState({},'','/login');login()}});
async function start(){S.me=await api('/api/me');if(S.me.authenticated){if(location.pathname==='/'||location.pathname==='/login'||!isAuthorizedPath(location.pathname))history.replaceState({},'',defaultPath());await shell()}else{if(location.pathname!=='/'&&location.pathname!=='/login')S.pendingPath=location.pathname;history.replaceState({},'','/login');login()}}
function login(){let admin=false;$('#app').innerHTML=`<div class="login"><div class="loginbox"><div class="loginart"><img class="login-logo" src="/assets/dawair-logo.jpg" alt="شعار فصل دوائر"><h1>فانتسي دوائر</h1><p class="muted">كوّن تشكيلتك ونافس على الصدارة</p></div><div class="loginform"><h1>تسجيل الدخول</h1><div class="tabs"><button id="p" class="btn">مشترك</button><button id="a" class="btn sec">مشرف</button></div><form id="lf"><div id="pf"><label>اسم المستخدم</label><input id="puser" class="input" autocomplete="username" placeholder="مثال: yousef"><br><br><label>رمز الدخول</label><input id="code" class="input" autocomplete="current-password"></div><div id="af" class="hidden"><label>اسم المستخدم</label><input id="user" class="input" value="admin"><br><br><label>كلمة المرور</label><input id="pass" type="password" class="input"></div><br><button class="btn" style="width:100%">دخول</button></form></div></div></div>`;
$('#p').onclick=()=>{admin=false;$('#pf').classList.remove('hidden');$('#af').classList.add('hidden');$('#p').className='btn';$('#a').className='btn sec'};
$('#a').onclick=()=>{admin=true;$('#af').classList.remove('hidden');$('#pf').classList.add('hidden');$('#a').className='btn';$('#p').className='btn sec'};
$('#lf').onsubmit=async e=>{e.preventDefault();try{await api(admin?'/api/login/admin':'/api/login/participant',{method:'POST',body:JSON.stringify(admin?{username:$('#user').value,password:$('#pass').value}:{username:$('#puser').value,code:$('#code').value})});S.me=await api('/api/me');let target=S.pendingPath&&isAuthorizedPath(S.pendingPath)?S.pendingPath:defaultPath();S.pendingPath=null;history.replaceState({},'',target);await shell()}catch(x){toast(x.message,true)}}}
async function shell(){S.boot=await api('/api/bootstrap');let admin=S.me.role==='admin';$('#app').innerHTML=`<div class="top"><div class="wrap"><div class="brand"><img class="brand-logo" src="/assets/dawair-logo.jpg" alt="شعار فصل دوائر"><div>فانتسي دوائر<div class="muted">${admin?'لوحة المشرف':esc(S.me.name)}</div></div></div><button id="logout" class="btn sec">خروج</button></div></div><main class="wrap"><nav id="nav" class="nav" aria-label="التنقل الرئيسي"></nav><div id="content"></div></main>`;
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});S.me={authenticated:false};S.boot=null;S.draft=null;history.replaceState({},'','/login');login()};
let nav=activeRoutes();$('#nav').innerHTML=nav.map(x=>`<a data-route href="${x.path}">${x.label}</a>`).join('');await renderRoute()}
function hero(title,sub){return `<section class="card hero"><h1>${title}</h1><p>${sub}</p></section>`}
function avatar(src,cls='avatar',alt=''){return src?`<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}">`:`<span class="${cls} avatar-fallback" aria-hidden="true">👤</span>`}
async function imageToProfileData(file){if(!file||!file.type.startsWith('image/'))throw Error('اختر ملف صورة');if(file.size>12*1024*1024)throw Error('الصورة الأصلية كبيرة جداً');let url=URL.createObjectURL(file);try{let im=await new Promise((ok,bad)=>{let x=new Image();x.onload=()=>ok(x);x.onerror=()=>bad(Error('تعذر قراءة الصورة'));x.src=url});let side=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-side)/2,sy=(im.naturalHeight-side)/2,canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;canvas.getContext('2d').drawImage(im,sx,sy,side,side,0,0,512,512);return canvas.toDataURL('image/jpeg',.84)}finally{URL.revokeObjectURL(url)}}
function home(){let r=S.boot.current_round,lb=S.boot.leaderboard||[],me=lb.find(x=>x.id===S.me.id);$('#content').innerHTML=`<section class="card hero home-hero"><div><h1>فانتسي دوائر</h1><p>اختر 8 لاعبين: اثنان من كل مجموعة، 6 أساسيين و2 احتياط، ثم اختر الكبتن ونائب الكبتن.</p></div><img class="hero-logo" src="/assets/dawair-logo.jpg" alt="شعار فصل دوائر"></section><div class="grid"><div class="stat"><b>${r?esc(r.name):'—'}</b><span>الجولة</span></div><div class="stat"><b>${me?.round_points||0}</b><span>نقاط الجولة</span></div><div class="stat"><b>${me?.total_points||0}</b><span>المجموع</span></div><div class="stat"><b>#${me?.rank||'—'}</b><span>ترتيبك</span></div></div><div class="card"><a class="btn yellow" data-route href="/lineup">اختيار التشكيلة</a></div>`}

function lineupPage(){if(!S.draft)initDraft();let D=S.draft,P=S.boot.players,r=S.boot.current_round;if(!r){$('#content').innerHTML='<div class="card">لا توجد جولة.</div>';return}let selected=new Set(D.players.map(x=>x.player_id)),counts={1:0,2:0,3:0,4:0};D.players.forEach(x=>{let p=P.find(y=>y.id===x.player_id);if(p)counts[p.group_no]++});let starters=D.players.filter(x=>x.role==='starter'),bench=D.players.filter(x=>x.role==='bench');

async function rounds(){let a=await api('/api/rounds');$('#content').innerHTML=`<div class="card"><h2>الجولات</h2><form id="addr" class="form"><input id="rn" class="input" type="number" placeholder="رقم الجولة"><input id="rname" class="input" placeholder="الاسم"><button class="btn">إنشاء</button></form></div><div class="card tablebox"><table class="table"><tr><th>#</th><th>الاسم</th><th>الحالة</th><th></th></tr>${a.map(x=>`<tr data-id="${x.id}"><td>${x.number}</td><td><input class="input n" value="${esc(x.name)}"></td><td><select class="st">${['draft','open','locked','scored'].map(s=>`<option ${x.status===s?'selected':''} value="${s}">${s}</option>`).join('')}</select></td><td><button class="btn sec sv">حفظ</button></td></tr>`).join('')}</table></div>`;$('#addr').onsubmit=async e=>{e.preventDefault();let n=+$('#rn').value;await api('/api/admin/rounds',{method:'POST',body:JSON.stringify({number:n,name:$('#rname').value||'الجولة '+n})});rounds()};$$('.sv').forEach(b=>b.onclick=async()=>{let t=b.closest('tr');await api('/api/admin/rounds/'+t.dataset.id,{method:'PUT',body:JSON.stringify({name:$('.n',t).value,status:$('.st',t).value})});toast('تم')})}
async function adminLineups(){let rr=await api('/api/rounds'),rid=S.adminLineupRound||rr[0]?.id;if(!rid)return $('#content').innerHTML='<div class="card">أنشئ جولة أولاً</div>';S.adminLineupRound=rid;let d=await api('/api/admin/lineups/'+rid),chipLabel={triple_captain:'الكبتن ×3',bench_boost:'تفعيل الدكة',wildcard:'تغيير شامل'};let playerCard=(p,l)=>`<div class="p">${avatar(p.profile_image,'avatar',p.name)}<b>${esc(p.name)} ${l.captain_player_id===p.player_id?'<span class="capmark">C</span>':''}${l.vice_player_id===p.player_id?'<span class="vicemark">VC</span>':''}</b><span class="muted">المجموعة ${p.group_no}</span></div>`;$('#content').innerHTML=hero('تشكيلات المشتركين','عرض تشكيلات جميع المشتركين في أي جولة.')+`<div class="card"><label>الجولة</label><select id="lr">${rr.map(x=>`<option value="${x.id}" ${x.id===rid?'selected':''}>${esc(x.name)} — ${esc(x.status)}</option>`).join('')}</select></div><div class="admin-lineups">${d.items.map(x=>{let l=x.lineup;if(!l)return `<div class="lineup-card"><div class="lineup-head">${avatar(x.participant.profile_image,'avatar-lg',x.participant.name)}<div class="meta"><h3>${esc(x.participant.name)}</h3><div class="muted">@${esc(x.participant.username||'')} · لم يسلّم تشكيلة</div></div></div></div>`;let st=l.players.filter(p=>p.role==='starter'),be=l.players.filter(p=>p.role==='bench');return `<div class="lineup-card"><div class="lineup-head">${avatar(x.participant.profile_image,'avatar-lg',x.participant.name)}<div class="meta"><h3>${esc(x.participant.name)}</h3><div class="muted">@${esc(x.participant.username||'')} · ${x.score} نقطة</div></div></div><div class="muted">الأساسيون</div><div class="lineup-mini">${st.map(p=>playerCard(p,l)).join('')}</div><div class="bench-title">الدكة</div><div class="lineup-mini">${be.map(p=>playerCard(p,l)).join('')}</div>${l.chip?`<div class="lineup-chip">الطاقة: ${esc(chipLabel[l.chip]||l.chip)}</div>`:''}</div>`}).join('')}</div>`;$('#lr').onchange=()=>{S.adminLineupRound=+$('#lr').value;adminLineups()}}
async function scores(){let rr=await api('/api/rounds'),rid=S.adminRound||rr[0]?.id;if(!rid)return $('#content').innerHTML='<div class="card">أنشئ جولة أولاً</div>';S.adminRound=rid;let a=await api('/api/admin/scores/'+rid);$('#content').innerHTML=`<div class="card"><h2>رصد النقاط</h2><select id="sr">${rr.map(x=>`<option value="${x.id}" ${x.id===rid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="card tablebox"><table class="table"><tr><th>اللاعب</th><th>هدف</th><th>فوز</th><th>هاتريك</th><th>حضور</th><th>أفضل</th><th>أصفر</th><th>أحمر</th><th>بدون حذاء</th><th>عكسي</th><th>نقاط</th></tr>${a.map(x=>`<tr data-id="${x.player_id}"><td>${esc(x.name)}</td>${['goals','wins','hattricks'].map(k=>`<td><input class="input ${k}" type="number" min="0" value="${x[k]}"></td>`).join('')}<td><input class="attendance" type="checkbox" ${x.attendance?'checked':''}></td>${['best_player','yellow','red','no_shoes','own_goals'].map(k=>`<td><input class="input ${k}" type="number" min="0" value="${x[k]}"></td>`).join('')}<td><b>${x.raw_points}</b></td></tr>`).join('')}</table></div><div class="savebar"><button id="ss" class="btn yellow">حفظ الرصد</button></div>`;$('#sr').onchange=()=>{S.adminRound=+$('#sr').value;scores()};$('#ss').onclick=async()=>{let list=$$('.table tr[data-id]').map(t=>{let o={player_id:+t.dataset.id,attendance:$('.attendance',t).checked?1:0};['goals','wins','hattricks','best_player','yellow','red','no_shoes','own_goals'].forEach(k=>o[k]=+$('.'+k,t).value||0);return o});await api('/api/admin/scores/'+rid,{method:'PUT',body:JSON.stringify({scores:list})});toast('تم حفظ النقاط')}}
async function settingsAdmin(){let s=await api('/api/admin/settings');let f=[['captain_multiplier','مضاعف الكبتن'],['free_transfers','التغييرات المجانية'],['points_goal','الهدف'],['points_win','الفوز'],['points_hattrick','الهاتريك'],['points_attendance','الحضور'],['points_best_player','أفضل لاعب'],['points_yellow','الأصفر'],['points_red','الأحمر'],['points_no_shoes','بدون حذاء'],['points_own_goal','هدف عكسي']];$('#content').innerHTML=`<div class="card"><h2>الإعدادات</h2><form id="sf" class="form">${f.map(x=>`<label>${x[1]}<input id="${x[0]}" class="input" type="number" value="${s[x[0]]}"></label>`).join('')}<button class="btn">حفظ</button></form></div><div class="card"><h2>تغيير كلمة المرور</h2><form id="pf" class="form"><input id="cur" class="input" type="password" placeholder="الحالية"><input id="next" class="input" type="password" placeholder="الجديدة"><button class="btn sec">تغيير</button></form></div><div class="card"><a class="btn sec" href="/api/admin/backup" target="_blank">نسخة احتياطية JSON</a></div>`;$('#sf').onsubmit=async e=>{e.preventDefault();let b={};f.forEach(x=>b[x[0]]=+$('#'+x[0]).value);await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(b)});toast('تم الحفظ');S.boot=await api('/api/bootstrap')};$('#pf').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/password',{method:'PUT',body:JSON.stringify({current:$('#cur').value,next:$('#next').value})});toast('تم التغيير')}catch(x){toast(x.message,true)}}}
start().catch(e=>{document.body.innerHTML='<pre>'+esc(e.message)+'</pre>'});
</script></body></html>
